<!DOCTYPE html>

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- dynamic base: use project root on GitHub Pages, local relative path when opened from file:// or a local server -->
	<script>
	(function(){
		try {
			var b = document.createElement('base');
			var host = location.hostname || '';
			if (host.indexOf('github.io') !== -1) {
				b.href = '/Student-s-Resources/';
			} else {
				b.href = '../';
			}
			document.head.appendChild(b);
		} catch (e) {
			var b2 = document.createElement('base'); b2.href = '../'; document.head.appendChild(b2);
		}
	})();
	</script>
	<title>Tercer Grado — Primer periodo | Espacio de Aprendizaje</title>
